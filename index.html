<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>图像到频谱瀑布图 | SDR# I/Q WAV 生成器</title><meta name="description" content="把图片编码成 SDR# 可播放的 I/Q WAV，自动选择参数并预览频谱瀑布图。图片在本机浏览器处理。">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#15293e;font:16px/1.55 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1150px;margin:auto;padding:40px 24px}h1{margin:0;font-size:clamp(27px,5vw,44px)}h2{margin:0 0 12px;font-size:20px}p{margin:8px 0 16px;color:#455c71}.panel,figure{background:white;border:1px solid #d5e0ea;border-radius:14px;padding:20px;margin:0}.controls,.views,.actions{display:flex;gap:16px;flex-wrap:wrap}.controls label{flex:1 1 145px;font-weight:650}select,input,button{font:inherit}select{display:block;width:100%;padding:7px;margin-top:5px;border:1px solid #9aaeba;border-radius:6px;background:white}.actions{align-items:center;margin-top:16px}button{padding:8px 16px;border:1px solid #087875;border-radius:7px;background:#087875;color:white;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.views{margin-top:18px}figure{flex:1 1 350px;min-width:0}canvas{width:100%;height:auto;display:block;background:#0d1221;image-rendering:pixelated}.ticks{display:flex;justify-content:space-between;font-size:13px;color:#455c71;margin-top:7px}.axis{font-size:13px;text-align:center;color:#455c71}.note{font-size:14px;margin:10px 0 0}#status{min-height:1.6em;font-size:14px;color:#455c71}
</style>
<style>
.actions{margin:0 0 12px}.actions label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}details{border-top:1px solid #d5e0ea;margin-top:14px;padding-top:12px}summary{width:fit-content;cursor:pointer;font-weight:650;color:#294759}details .controls{margin-top:12px}details .checks{display:flex;flex-wrap:wrap;gap:18px;margin:12px 0 0}#status{margin-top:6px}
</style>
<main>
<h1>图像到频谱瀑布图</h1>
<p>导入图片后自动生成频谱预览，可直接导出 I/Q WAV 到 SDR# 回放。</p>
<section class="panel">
<div class="actions"><label>选择图片 <input id="upload" type="file" accept="image/*"></label><button id="export" disabled>导出 I/Q WAV</button></div>
<div id="status" role="status"></div>
<details>
<summary>手动设置</summary>
<div class="controls">
<label>图像模式<select id="mode"><option value="auto">自动</option><option value="icon">图标</option><option value="portrait">竖图</option><option value="photo">横向照片</option></select></label>
<label>频率列间隔<select id="spacing"><option value="500">500 Hz</option><option value="1000" selected>1000 Hz</option><option value="1500">1500 Hz</option></select></label>
<label>每行持续时间<select id="duration"><option value=".11">0.11 s</option><option value=".22" selected>0.22 s</option><option value=".33">0.33 s</option></select></label>
<label>预览 FFT 点数<select id="fftSize"><option>128</option><option>512</option><option>1024</option><option selected>4096</option></select></label>
</div>
<div class="checks"><label><input id="smooth" type="checkbox"> 减少瀑布图条纹</label><label><input id="bandPower" type="checkbox"> 按像素频带预览</label><button type="button" id="reset">恢复自动参数</button></div>
</details>
</section>
<div class="views">
<figure><h2 id="imageTitle">原图 · 96 × 60</h2><canvas id="original" width="96" height="60" aria-label="原始灰度图"></canvas></figure>
<figure><h2>行中心频谱预览</h2><canvas id="waterfall" width="600" height="375" aria-label="随时间排列的双边频谱"></canvas><div class="ticks" id="ticks"></div><div class="axis">频率偏移（kHz）</div><p class="note">时间由下往上。勾选频带功率后，把每列对应频带内的 FFT 功率相加，以灰度显示。</p></figure>
</div>
</main>
<script>
'use strict';
const fs=192000;
let width=96, height=60, selectedImage, profile='icon';
let timePerRow=.33, automatic=true;
const profileNames={icon:'图标',portrait:'竖图',photo:'横向照片'};
const el=id=>document.getElementById(id);
const original=el('original').getContext('2d',{willReadFrequently:true});
const waterfall=el('waterfall').getContext('2d');
let pixels;

function luminance(data, index){
  return .2126*data[index]+.7152*data[index+1]+.0722*data[index+2];
}

function photoAmplitude(gray){
  // Retain shadow detail while smoothly fading the darkest tones to silence.
  const toe=Math.min(1,gray/.045);
  const fade=toe*toe*(3-2*toe);
  return fade*10**((gray-1)*24/20);
}

function chooseProfile(img){
  const sample=document.createElement('canvas');
  sample.width=sample.height=48;
  const context=sample.getContext('2d',{willReadFrequently:true});
  context.drawImage(img,0,0,48,48);
  const data=context.getImageData(0,0,48,48).data;
  const histogram=new Uint32Array(32);
  let count=0;
  for(let index=0;index<data.length;index+=4){
    if(data[index+3]<128) continue;
    histogram[Math.min(31,Math.floor(luminance(data,index)/8))]++;
    count++;
  }
  const activeLevels=histogram.filter(value=>value>=Math.max(2,count*.015)).length;
  if(activeLevels<=6) return 'icon';
  return img.height>img.width?'portrait':'photo';
}

function setImage(img){
  selectedImage=img;
  original.fillStyle='#000';
  original.fillRect(0,0,width,height);
  const scale=Math.min(width/img.width,height/img.height);
  const w=img.width*scale,h=img.height*scale;
  original.drawImage(img,(width-w)/2,(height-h)/2,w,h);
  const frame=original.getImageData(0,0,width,height);
  pixels=new Float64Array(width*height);
  const histogram=new Uint32Array(256);
  for(let i=0;i<pixels.length;i++){
    const p=i*4;
    const gray=Math.round(luminance(frame.data,p));
    frame.data[p]=frame.data[p+1]=frame.data[p+2]=gray;
    histogram[gray]++;
  }
  let low=0,high=255;
  if(profile!=='icon'){
    function percentile(fraction){
      let count=0;
      return histogram.findIndex(value=>(count+=value)>=pixels.length*fraction);
    }
    const dark=percentile(.02),bright=percentile(.98);
    if(bright-dark>=50){low=dark;high=bright;}
  }
  for(let i=0;i<pixels.length;i++){
    const raw=frame.data[i*4]/255;
    const stretched=Math.max(0,Math.min(1,(frame.data[i*4]-low)/(high-low)));
    pixels[i]=Math.sqrt(profile==='icon'?raw:.8*raw+.2*stretched);
  }
  original.putImageData(frame,0,0);
  refresh();
}

function synthesize(){
  const gap=Number(el('spacing').value);
  const smooth=el('smooth').checked;
  const period=smooth?6144:768;
  const toneCount=smooth?8:1;
  const tones=Array.from({length:width},(_,col)=>{
    const center=(col-(width-1)/2)*gap;
    const real=new Float64Array(period),imag=new Float64Array(period);
    for(let tone=0;tone<toneCount;tone++){
      const index=col*toneCount+tone;
      const frequency=center+(tone-(toneCount-1)/2)*gap/toneCount;
      const phase=(index*index*0.61803398875%1)*2*Math.PI;
      const weight=1/Math.sqrt(toneCount);
      for(let n=0;n<period;n++){
        const theta=2*Math.PI*frequency*n/fs+phase;
        real[n]+=weight*Math.cos(theta); imag[n]+=weight*Math.sin(theta);
      }
    }
    return {real,imag};
  });
  let peak=0;
  const rows=Array.from({length:height},(_,row)=>{
    const real=new Float64Array(period),imag=new Float64Array(period);
    for(let col=0;col<width;col++){
      let amplitude=pixels[row*width+col];
      if(smooth){
        const gray=amplitude**2;
        amplitude=photoAmplitude(gray);
      }
      if(amplitude===0) continue;
      const tone=tones[col];
      for(let n=0;n<period;n++){
        real[n]+=amplitude*tone.real[n]; imag[n]+=amplitude*tone.imag[n];
      }
    }
    for(let n=0;n<period;n++) peak=Math.max(peak,Math.hypot(real[n],imag[n]));
    return {real,imag};
  });
  return {rows,period,gain:peak>0?.9/peak:1};
}

function fft(real,imag){
  const n=real.length;
  for(let i=1,j=0;i<n;i++){
    let bit=n>>1;
    for(;j&bit;bit>>=1) j^=bit;
    j^=bit;
    if(i<j){[real[i],real[j]]=[real[j],real[i]];[imag[i],imag[j]]=[imag[j],imag[i]];}
  }
  for(let length=2;length<=n;length*=2){
    for(let k=0;k<length/2;k++){
      const theta=-2*Math.PI*k/length,c=Math.cos(theta),s=Math.sin(theta);
      for(let base=0;base<n;base+=length){
        const a=base+k,b=a+length/2;
        const r=c*real[b]-s*imag[b],v=s*real[b]+c*imag[b];
        real[b]=real[a]-r; imag[b]=imag[a]-v; real[a]+=r; imag[a]+=v;
      }
    }
  }
}

function refresh(){
  if(!pixels) return;
  const {rows,period,gain}=synthesize();
  const fftSize=Number(el('fftSize').value), duration=Number(el('duration').value);
  const spacing=Number(el('spacing').value);
  const span=Math.min(fs/2-spacing/2,Math.max(spacing,Math.ceil(width*spacing*.55/1000)*1000));
  const useBands=el('bandPower').checked;
  const smooth=el('smooth').checked;
  const canvas=el('waterfall'), frame=waterfall.createImageData(canvas.width,canvas.height);
  for(let i=0;i<frame.data.length;i+=4){
    frame.data[i]=16; frame.data[i+1]=20; frame.data[i+2]=37; frame.data[i+3]=255;
  }
  const rowSamples=Math.round(duration*fs);
  const start=Math.round((rowSamples-fftSize)/2);
  for(let row=0;row<height;row++){
    const real=new Float64Array(fftSize),imag=new Float64Array(fftSize);
    let windowSum=0, windowEnergy=0;
    for(let n=0;n<fftSize;n++){
      const w=.5-.5*Math.cos(2*Math.PI*n/fftSize);
      const i=(start+n+(smooth?(height-1-row)*rowSamples:0))%period;
      real[n]=rows[row].real[i]*w; imag[n]=rows[row].imag[i]*w;
      windowSum+=w;
      windowEnergy+=w*w;
    }
    fft(real,imag);
    const bands=new Float64Array(width);
    if(useBands){
      for(let k=0;k<fftSize;k++){
        const f=(k<fftSize/2?k:k-fftSize)*fs/fftSize;
        const column=Math.floor(f/spacing+width/2);
        if(column>=0 && column<width)
          bands[column]+=(real[k]**2+imag[k]**2)/(fftSize*windowEnergy);
      }
    }
    const top=canvas.height*(1-duration/timePerRow);
    const y0=Math.round(top+row*duration/timePerRow*canvas.height/height);
    const y1=Math.round(top+(row+1)*duration/timePerRow*canvas.height/height);
    for(let x=0;x<canvas.width;x++){
      const f=(2*x/(canvas.width-1)-1)*span;
      const k=(Math.round(f*fftSize/fs)+fftSize)%fftSize;
      const db=20*Math.log10(Math.max(1e-9,Math.hypot(real[k],imag[k])*gain/windowSum));
      const level=Math.min(1,Math.max(0,(db+65)/45));
      const column=Math.floor(f/spacing+width/2);
      const power=bands[column]??0;
      const brightness=smooth?1+10*Math.log10(Math.max(power,1e-9))/24:power;
      const gray=Math.round(255*Math.max(0,Math.min(1,brightness)));
      for(let y=y0;y<y1;y++){
        const index=4*(y*canvas.width+x);
        frame.data[index]=useBands?gray:16+239*level;
        frame.data[index+1]=useBands?gray:20+194*level**2;
        frame.data[index+2]=useBands?gray:37+65*level;
        frame.data[index+3]=255;
      }
    }
  }
  waterfall.putImageData(frame,0,0);
  el('ticks').replaceChildren(...[-1,-.5,0,.5,1].map(f=>{
    const label=document.createElement('span');
    label.textContent=String(f*span/1000);
    return label;
  }));
  el('status').textContent=(automatic?'自动 · ':'手动 · ')+profileNames[profile]+' '+width+' × '+height+' · 单幅 '+(height*duration).toFixed(1)+' s · '+spacing+' Hz / 列 · 预览 FFT '+fftSize+' 点 · '+(smooth?'多频率编码':'单频率编码');
  el('export').disabled=false;
}

function makeWav(){
  const {rows,period,gain}=synthesize();
  const smooth=el('smooth').checked;
  const rowSamples=Math.round(fs*Number(el('duration').value));
  const guard=Math.round(.7*fs), edge=Math.round((smooth?.004:.005)*fs);
  const repeats=smooth?1:2;
  const dataSize=(repeats*height*rowSamples+(repeats+1)*guard)*4;
  const bytes=new ArrayBuffer(44+dataSize), view=new DataView(bytes);
  const tag=(offset,value)=>[...value].forEach((ch,i)=>view.setUint8(offset+i,ch.charCodeAt(0)));
  tag(0,'RIFF'); view.setUint32(4,36+dataSize,true); tag(8,'WAVE');
  tag(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,2,true); view.setUint32(24,fs,true); view.setUint32(28,4*fs,true);
  view.setUint16(32,4,true); view.setUint16(34,16,true); tag(36,'data'); view.setUint32(40,dataSize,true);
  let offset=44+guard*4;
  const ramp=Float64Array.from({length:edge},(_,n)=>Math.sin(Math.PI*n/(2*(edge-1)))**2);
  for(let pass=0;pass<repeats;pass++){
    for(let row=height-1;row>=0;row--){
      const start=(height-1-row)*rowSamples;
      for(let n=0;n<rowSamples;n++){
        const i=((smooth?start:0)+n)%period;
        let real=rows[row].real[i],imag=rows[row].imag[i];
        if(smooth && n<edge && row<height-1){
          const weight=ramp[n],previous=rows[row+1];
          real=(1-weight)*previous.real[i]+weight*real;
          imag=(1-weight)*previous.imag[i]+weight*imag;
        }
        const distance=smooth?Math.min(start+n,height*rowSamples-1-start-n):Math.min(n,rowSamples-1-n);
        const scale=32767*gain*(distance<edge?ramp[distance]:1);
        view.setInt16(offset,Math.round(scale*real),true);
        view.setInt16(offset+2,Math.round(scale*imag),true);
        offset+=4;
      }
    }
    offset+=guard*4;
  }
  return bytes;
}

el('export').onclick=()=>{
  const url=URL.createObjectURL(new Blob([makeWav()],{type:'audio/wav'}));
  const link=document.createElement('a');
  link.href=url;
  link.download='SDRSharp_20261121_030000Z_100000000Hz_'+(el('smooth').checked?'Web_Smooth_IQ.wav':'Web_IQ.wav');
  link.click();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
};
for(const id of ['spacing','duration','fftSize','bandPower','smooth']) el(id).onchange=()=>{
  automatic=false;
  refresh();
};
function setMode(){
  if(!selectedImage) return;
  const mode=el('mode').value;
  automatic=mode==='auto';
  profile=automatic?chooseProfile(selectedImage):mode;
  const [maxWidth,maxHeight]={portrait:[145,198],photo:[168,168],icon:[96,96]}[profile];
  const factor=Math.min(1,maxWidth/selectedImage.width,maxHeight/selectedImage.height);
  width=Math.max(1,Math.round(selectedImage.width*factor));
  height=Math.max(1,Math.round(selectedImage.height*factor));
  const duration=Math.max(.035,Math.min(.33,Math.round(11000/height)/1000));
  const choices=[Math.max(.035,duration*.6),duration,Math.min(.5,duration*1.4)].map(value=>Math.round(value*1000)/1000);
  const uniqueChoices=[...new Set(choices)];
  timePerRow=uniqueChoices.at(-1);
  el('original').width=width;
  el('original').height=height;
  el('waterfall').height=Math.max(190,Math.min(650,Math.round(600*height/width)));
  el('imageTitle').textContent='灰度原图 · '+width+' × '+height;
  el('spacing').options[2].disabled=width*1500>180000;
  el('spacing').value=width<=64?'1500':'1000';
  el('bandPower').checked=profile!=='icon';
  el('smooth').checked=profile!=='icon';
  el('fftSize').value=profile==='icon'?'1024':'4096';
  el('duration').replaceChildren(...uniqueChoices.map(value=>new Option(value+' s',value)));
  el('duration').value=String(duration);
  setImage(selectedImage);
}
el('mode').onchange=setMode;
el('reset').onclick=()=>{el('mode').value='auto';setMode();};
el('upload').onchange=()=>{
  const file=el('upload').files[0];
  if(!file) return;
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    selectedImage=img;
    el('mode').value='auto';
    setMode();
    URL.revokeObjectURL(url);
  };
  img.onerror=()=>{URL.revokeObjectURL(url);el('status').textContent='无法读取这张图片，请尝试 PNG、JPEG 或 WebP。';};
  img.src=url;
};
const mascot=new Image();
mascot.onload=()=>{if(!selectedImage){selectedImage=mascot;setMode();}};
mascot.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAAA8CAAAAAC8v+BoAAABPElEQVR4nO2WyRGDMAxFv1MG1WSoLJUxVEMbyiXD4kXSF1sO/ANjY0nPskAAPHp0sYT2eJHxaQIHCIgCCPhDYgCyup4B4AtMAgzQtBcglZFDboAVdWqk4AVIc2Io9h6UhAmNKjgBsScIAFIw/tZv3nsXA9T2vzhmJ9O17ByAlI1LRiwD2Zpm0xWiDM88RakYuHRUu+5QT8APSNXhMRIREfUGcECzC8r9FCXthqJINz2nXUcV+OBwjc9xkkvAVMyOALQ37CLcXwPlxF3FsABqEA/BABghHAQdYAawCSrAsUHT5NZmJ4aFtW4ti+3tsFH2t10aVuNeM8zUrkHm1tetSkM3oK02axeAChsBBEkEIJYCnwHJYQChFO7/4KzVg0/j4mb3BoDxN/nMl0VDmcA4O6L2z/dfNQi/zo9u1Rf1d0tgLt7r7gAAAABJRU5ErkJggg==';
</script></html>
